<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="../assets/site.css"><link rel="stylesheet" href="editor.css">
    <title>harriethong'blog 编辑器</title>
  </head>
  <body class="editor-body">
    <header class="editor-topbar">
      <div class="editor-mark"><span class="mark-dot"></span><strong>harriethong'blog</strong></div>
      <div class="topbar-center"><span>编辑文章</span><select id="article-select"></select><button class="icon-button" id="new-article" title="添加新文章">＋</button></div>
      <div class="topbar-actions"><span id="save-status">已保存</span><button class="ghost-button" id="preview-button">预览</button><button class="primary-button" id="publish-button">发布到 GitHub</button></div>
    </header>
    <div class="editor-layout">
      <aside class="tool-panel">
        <div class="panel-tabs"><button class="panel-tab active" data-tab="articles">文章</button><button class="panel-tab" data-tab="site">站点</button><button class="panel-tab" data-tab="backup">备份</button></div>
        <div class="panel-content active" data-panel="articles">
          <p class="panel-help">选择文章后，在右侧编辑标题、摘要、分类和正文。保存会写入当前浏览器草稿。</p>
          <div id="article-list" class="editor-article-list"></div>
          <button class="wide-button add-button" id="new-article-side">＋ 新建文章</button>
        </div>
        <div class="panel-content" data-panel="site">
          <div class="field-group"><label>博客名称</label><input id="site-title" type="text"></div>
          <div class="field-group"><label>一句话介绍</label><input id="site-tagline" type="text"></div>
          <div class="field-group"><label>侧边栏介绍</label><textarea id="sidebar-intro"></textarea></div>
          <div class="color-grid"><label>强调色<input id="color-accent" type="color"></label><label>背景色<input id="color-bg" type="color"></label><label>卡片色<input id="color-surface" type="color"></label><label>文字色<input id="color-text" type="color"></label></div>
        </div>
        <div class="panel-content" data-panel="backup">
          <p class="panel-help">备份文件包含所有文章和站点设置。换电脑时可以导入。</p>
          <button class="wide-button" id="export-json">导出 JSON 备份</button>
          <label class="wide-button file-button">导入 JSON 备份<input id="import-json" type="file" accept="application/json"></label>
          <button class="wide-button danger" id="reset-site">恢复示例内容</button>
        </div>
      </aside>
      <main class="canvas-area"><div class="canvas-note">左侧选择文章 · 右侧编辑内容 · 中间实时预览</div><div class="canvas-viewport"><div id="canvas-root"></div></div></main>
      <aside class="inspector-panel"><div id="inspector-content"></div></aside>
    </div>
    <div class="modal-backdrop" id="publish-modal" hidden><section class="modal-card"><button class="modal-close" data-close-modal>×</button><p class="modal-kicker">GITHUB PAGES</p><h2>发布博客</h2><p>使用一个只拥有该仓库 Contents 读写权限的 fine-grained token。令牌只在本次页面会话中使用。</p><div class="modal-grid"><label>GitHub 用户名<input id="github-owner" placeholder="harriethong846"></label><label>仓库<input id="github-repo" placeholder="harriethong-visual-editor"></label><label>分支<input id="github-branch" value="main"></label><label>访问令牌<input id="github-token" type="password" placeholder="github_pat_..."></label></div><div id="publish-message" class="publish-message"></div><div class="modal-actions"><button class="ghost-button" data-close-modal>取消</button><button class="primary-button" id="confirm-publish">发布更新</button></div></section></div>
    <script src="../assets/site.js"></script><script src="editor.js"></script>
  </body>
</html>
